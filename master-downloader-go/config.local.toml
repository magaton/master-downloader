# Local test setup: 4 sites served by tools/testserver
#   terminal 1: go run ./tools/testserver --delay 2
#   terminal 2: go run . -c config.local.toml -t 10
duration_seconds = 10
domains = [
    "http://127.0.0.1:8001/",
    "http://127.0.0.1:8002/",
    "http://127.0.0.1:8003/",
    "http://127.0.0.1:8004/",
]
output_dir = "output"
concurrency_per_domain = 64
download_timeout = 15
obey_robots = true
include_subdomains = false
pin_cpu = true
