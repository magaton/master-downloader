[project]
name = "master-downloader-python"
version = "0.1.0"
description = "Throughput-optimised multi-domain HTML crawler built on Scrapy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "scrapy>=2.19,<3",
    "uvloop>=0.19; sys_platform != 'win32'",
]

[project.scripts]
master-downloader-python = "master_downloader_python.main:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.10.0"]
build-backend = "uv_build"
